[project]
name = "tacit-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["tacit-cli", "tacit-mcp", "tacit-api", "tacit-worker"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "pyyaml>=6,<7"]

[tool.uv.workspace]
members = ["packages/*", "services/*"]
[tool.uv.sources]
tacit-cli = { workspace = true }
tacit-mcp = { workspace = true }
tacit-api = { workspace = true }
tacit-worker = { workspace = true }
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"services/api/src/tacit_api/app.py" = ["B008"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tacit_contracts", "tacit_domain", "tacit_client", "tacit_cli", "tacit_mcp", "tacit_api", "tacit_worker"]
