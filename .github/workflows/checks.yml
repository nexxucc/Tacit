name: checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tacit
          POSTGRES_PASSWORD: tacit
          POSTGRES_DB: tacit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tacit -d tacit_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TACIT_TEST_DATABASE_URL: postgresql+psycopg://tacit:tacit@127.0.0.1:5432/tacit_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
