[project]
name = "tacit-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ['tacit-domain', 'fastapi>=0.115,<1', 'uvicorn>=0.34,<1', 'pydantic-settings>=2.7,<3', 'sqlalchemy>=2.0,<3', 'psycopg[binary]>=3.2,<4', 'alembic>=1.14,<2', 'httpx>=0.28,<1', 'cryptography>=44,<51']
[project.scripts]
tacit-api = "tacit_api.main:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.uv.sources]
tacit-domain = { workspace = true }
